# AMPLIFY — Apixaban for the Initial Management of Pulmonary Embolism and
# Deep-Vein Thrombosis as First-Line Therapy
# Source: Agnelli G et al. "Oral Apixaban for the Treatment of Acute Venous
# Thromboembolism." N Engl J Med. 2013;369(9):799-808.

trial:
  key: amplify
  name: AMPLIFY
  full_name: "Apixaban for the Initial Management of Pulmonary Embolism and Deep-Vein Thrombosis as First-Line Therapy"
  citation: "Agnelli G et al., N Engl J Med 2013;369:799-808"
  published_hr: 0.84
  published_hr_ci: [0.60, 1.18]
  rct_duplicate_success: true

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: apixaban
    role: treated
    keywords: [APIXABAN, ELIQUIS]
  - name: enoxaparin_warfarin
    role: control
    # Enoxaparin bridge to warfarin (standard of care comparator)
    keywords: [ENOXAPARIN, DALTEPARIN, TINZAPARIN, WARFARIN, COUMADIN, JANTOVEN]

inclusion:
  age_min: 18
  required_icd:
    # Acute VTE (DVT or PE)
    - name: vte_icd_ever
      codes: [I26, I80]
      lookback_days: 365
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: recurrent_vte_vte_death
    followup_days: 365            # 6-month primary analysis; extend to 12m for EHR
    censor: administrative
    components:
      - type: condition_icd       # Recurrent DVT
        codes: [I80]
        char: 3
      - type: condition_icd       # Recurrent PE
        codes: [I26]
        char: 3
      - type: mortality           # VTE-related death (proxied by all-cause death)
  proxy_note: >
    VTE-related death proxied by all-cause mortality. Control arm is enoxaparin bridge
    to warfarin. Wide CI (0.60-1.18) reflects non-inferiority design.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
