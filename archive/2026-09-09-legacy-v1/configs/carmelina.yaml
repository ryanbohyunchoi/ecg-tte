# CARMELINA — Cardiovascular and Renal Microvascular Outcome Study with Linagliptin
# Source: Rosenstock J et al. "Effect of Linagliptin vs Placebo on Major Cardiovascular
# Events in Adults With Type 2 Diabetes and High Cardiovascular and Renal Risk."
# JAMA. 2019;321(1):69-79.

trial:
  key: carmelina
  name: CARMELINA
  full_name: "Cardiovascular and Renal Microvascular Outcome Study with Linagliptin"
  citation: "Rosenstock J et al., JAMA 2019;321:69-79"
  published_hr: 1.02
  published_hr_ci: [0.89, 1.17]
  rct_duplicate_success: true

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: linagliptin
    role: treated
    keywords: [LINAGLIPTIN, TRADJENTA, GLYXAMBI, JENTADUETO]
  - name: sulfonylurea
    role: control
    # Active comparator proxy for placebo arm: sulfonylurea class
    # DPP4i vs SU is the canonical active comparator design for DPP4i trials
    keywords: [GLIPIZIDE, GLIMEPIRIDE, GLYBURIDE, GLIBENCLAMIDE, TOLBUTAMIDE]

inclusion:
  age_min: 18
  required_icd:
    - name: dm_icd_ever
      codes: [E11]
      lookback_days: 1825
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: mace_3p
    followup_days: 730            # ~2.2 years median follow-up
    censor: administrative
    components:
      - type: mortality           # CV death proxy (all-cause death)
      - type: condition_icd       # MI
        codes: [I21, I22]
        char: 3
      - type: condition_icd       # Stroke
        codes: [I63, I64, G45]
        char: 3
  proxy_note: >
    CV death proxied by all-cause mortality (Yale death table is date-only).
    Active comparator sulfonylurea substituted for placebo arm per DPP4i-vs-SU
    active comparator design convention.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
