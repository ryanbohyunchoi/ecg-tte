# CANVAS — Canagliflozin Cardiovascular Assessment Study
# Source: Neal B et al. "Canagliflozin and Cardiovascular and Renal Events in
# Type 2 Diabetes." N Engl J Med. 2017;377(7):644-657.

trial:
  key: canvas
  name: CANVAS
  full_name: "Canagliflozin Cardiovascular Assessment Study"
  citation: "Neal B et al., N Engl J Med 2017;377:644-657"
  published_hr: 0.86
  published_hr_ci: [0.75, 0.97]
  rct_duplicate_success: true

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: canagliflozin
    role: treated
    keywords: [CANAGLIFLOZIN, INVOKANA]
  - name: dpp4i
    role: control
    # Active comparator proxy for placebo arm: DPP4 inhibitor class
    keywords: [SITAGLIPTIN, SAXAGLIPTIN, LINAGLIPTIN, ALOGLIPTIN, VILDAGLIPTIN]

inclusion:
  age_min: 18
  required_icd:
    - name: dm_icd_ever
      codes: [E11]
      lookback_days: 1825
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: mace_3p
    followup_days: 1460           # ~2.4 years mean follow-up (CANVAS+CANVAS-R combined)
    censor: administrative
    components:
      - type: mortality           # CV death proxy (all-cause death)
      - type: condition_icd       # MI
        codes: [I21, I22]
        char: 3
      - type: condition_icd       # Stroke
        codes: [I63, I64, G45]
        char: 3
  proxy_note: >
    CV death proxied by all-cause mortality (Yale death table is date-only).
    Active comparator DPP4i substituted for placebo arm. CANVAS programme
    included both CANVAS and CANVAS-R trials.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
