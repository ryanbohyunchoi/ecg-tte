# DECLARE-TIMI 58 — Dapagliflozin Effect on Cardiovascular Events
# Source: Wiviott SD et al. "Dapagliflozin and Cardiovascular Outcomes in Type 2 Diabetes."
# N Engl J Med. 2019;380(4):347-357.

trial:
  key: declare_timi58
  name: DECLARE-TIMI 58
  full_name: "Dapagliflozin Effect on Cardiovascular Events — Thrombolysis in Myocardial Infarction 58"
  citation: "Wiviott SD et al., N Engl J Med 2019;380:347-357"
  published_hr: 0.83
  published_hr_ci: [0.73, 0.95]
  rct_duplicate_success: true

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: dapagliflozin
    role: treated
    keywords: [DAPAGLIFLOZIN, FARXIGA, FORXIGA]
  - name: dpp4i
    role: control
    # Active comparator proxy for placebo arm: DPP4 inhibitor class
    keywords: [SITAGLIPTIN, SAXAGLIPTIN, LINAGLIPTIN, ALOGLIPTIN, VILDAGLIPTIN]

inclusion:
  age_min: 18
  required_icd:
    - name: dm_icd_ever
      codes: [E11]
      lookback_days: 1825
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: cv_death_hf_hosp
    followup_days: 1460           # ~48 months median follow-up
    censor: administrative
    components:
      - type: mortality           # CV death proxy (all-cause death)
      - type: inpatient_icd       # HF hospitalization
        codes: [I50]
        char: 3
        visit_concept_ids: [9201, 262]
      - type: condition_icd       # MI (for 3-MACE co-primary)
        codes: [I21, I22]
        char: 3
      - type: condition_icd       # Stroke
        codes: [I63, I64, G45]
        char: 3
  proxy_note: >
    DECLARE-TIMI 58 had two co-primary endpoints: (1) CV death + HF hospitalization
    and (2) 3-point MACE. Components combined here as composite. CV death proxied by
    all-cause mortality. Active comparator DPP4i substituted for placebo arm.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
