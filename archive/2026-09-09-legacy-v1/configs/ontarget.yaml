# ONTARGET — Ongoing Telmisartan Alone and in combination with Ramipril Global
# Endpoint Trial
# Source: ONTARGET Investigators. "Telmisartan, Ramipril, or Both in Patients at
# High Risk for Vascular Events." N Engl J Med. 2008;358(15):1547-1559.

trial:
  key: ontarget
  name: ONTARGET
  full_name: "Ongoing Telmisartan Alone and in combination with Ramipril Global Endpoint Trial"
  citation: "ONTARGET Investigators, N Engl J Med 2008;358:1547-1559"
  published_hr: 1.01
  published_hr_ci: [0.94, 1.09]
  rct_duplicate_success: false

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: telmisartan
    role: treated
    keywords: [TELMISARTAN, MICARDIS, TWYNSTA]
  - name: ramipril
    role: control
    keywords: [RAMIPRIL, ALTACE]

inclusion:
  age_min: 18

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: mace_4p_hf
    followup_days: 1700           # ~56 months median follow-up
    censor: administrative
    components:
      - type: mortality           # CV death proxy (all-cause death)
      - type: condition_icd       # MI
        codes: [I21, I22]
        char: 3
      - type: condition_icd       # Stroke
        codes: [I63, I64, G45]
        char: 3
      - type: inpatient_icd       # HF hospitalization
        codes: [I50]
        char: 3
        visit_concept_ids: [9201, 262]
  proxy_note: >
    CV death proxied by all-cause mortality. Direct active vs active comparison
    (telmisartan vs ramipril) — no placebo proxy needed. Trial demonstrated
    non-inferiority of telmisartan to ramipril (HR 1.01, CI 0.94-1.09).
    Emulation=false in RCT-DUPLICATE.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
