# TRITON-TIMI 38 — Trial to Assess Improvement in Therapeutic Outcomes by Optimizing
# Platelet Inhibition with Prasugrel–Thrombolysis in Myocardial Infarction 38
# Source: Wiviott SD et al. "Prasugrel versus Clopidogrel in Patients with Acute
# Coronary Syndromes." N Engl J Med. 2007;357(20):2001-2015.

trial:
  key: triton_timi38
  name: TRITON-TIMI 38
  full_name: "Trial to Assess Improvement in Therapeutic Outcomes by Optimizing Platelet Inhibition with Prasugrel–Thrombolysis in Myocardial Infarction 38"
  citation: "Wiviott SD et al., N Engl J Med 2007;357:2001-2015"
  published_hr: 0.81
  published_hr_ci: [0.73, 0.90]
  rct_duplicate_success: true

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: prasugrel
    role: treated
    keywords: [PRASUGREL, EFFIENT]
  - name: clopidogrel
    role: control
    keywords: [CLOPIDOGREL, PLAVIX]

inclusion:
  age_min: 18
  required_icd:
    # ACS (NSTEMI/STEMI/UA) requiring PCI
    - name: acs_icd_ever
      codes: [I21, I22, I200]
      lookback_days: 365
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: mace_3p
    followup_days: 548            # ~15 months median follow-up
    censor: administrative
    components:
      - type: mortality           # CV death proxy (all-cause death)
      - type: condition_icd       # MI
        codes: [I21, I22]
        char: 3
      - type: condition_icd       # Stroke
        codes: [I63, I64, G45]
        char: 3
  proxy_note: >
    CV death proxied by all-cause mortality. Direct active vs active comparison
    (prasugrel vs clopidogrel) — no placebo proxy needed. Trial enrolled ACS
    patients undergoing PCI.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
