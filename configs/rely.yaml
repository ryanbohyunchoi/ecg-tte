# RE-LY — Randomized Evaluation of Long-Term Anticoagulation Therapy
# Source: Connolly SJ et al. "Dabigatran versus Warfarin in Patients with Atrial
# Fibrillation." N Engl J Med. 2009;361(12):1139-1151.

trial:
  key: rely
  name: RE-LY
  full_name: "Randomized Evaluation of Long-Term Anticoagulation Therapy"
  citation: "Connolly SJ et al., N Engl J Med 2009;361:1139-1151"
  published_hr: 0.66
  published_hr_ci: [0.53, 0.82]
  rct_duplicate_success: true

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: dabigatran
    role: treated
    # RE-LY used dabigatran 150mg; we capture all dabigatran (110 + 150 mg in EHR)
    keywords: [DABIGATRAN, PRADAXA]
  - name: warfarin
    role: control
    keywords: [WARFARIN, COUMADIN, JANTOVEN]

inclusion:
  age_min: 18
  required_icd:
    - name: afib_icd_ever
      codes: [I48]
      lookback_days: 1825
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: stroke_systemic_embolism
    followup_days: 730            # ~2 years median follow-up
    censor: administrative
    components:
      - type: condition_icd       # Stroke (ischemic + hemorrhagic)
        codes: [I63, I64, G45]
        char: 3
      - type: condition_icd       # Systemic embolism
        codes: [I74]
        char: 3
  proxy_note: >
    Direct active vs active comparison (dabigatran 150mg vs warfarin) — no placebo
    proxy needed. Published HR refers to dabigatran 150mg arm. EHR captures all
    dabigatran doses; sensitivity can restrict to high-dose NDC codes via Stage 3.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
