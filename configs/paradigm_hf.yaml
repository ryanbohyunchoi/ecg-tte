# PARADIGM-HF — Prospective Comparison of ARNI with ACEI to Determine Impact on
# Global Mortality and Morbidity in Heart Failure
# Source: McMurray JJV et al. "Angiotensin-Neprilysin Inhibition versus Enalapril
# in Heart Failure." N Engl J Med. 2014;371(11):993-1004.

trial:
  key: paradigm_hf
  name: PARADIGM-HF
  full_name: "Prospective Comparison of ARNI with ACEI to Determine Impact on Global Mortality and Morbidity in Heart Failure"
  citation: "McMurray JJV et al., N Engl J Med 2014;371:993-1004"
  published_hr: 0.80
  published_hr_ci: [0.73, 0.87]
  rct_duplicate_success: false

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

# ── Stage-3 flat overrides (picked up by _merge_yaml) ──────────────────────────
# Entresto FDA approval: 2015-07-07. No ARNI dispenses before this date exist.
min-index-date: "2015-07-07"
# PARADIGM-HF had no upper age limit
age-max: 120
# HFrEF gate on (EF ≤ 40% OR I50)
require-hfref: true
lvef-max: 40.0
ef-source: echo_or_icd
# PARADIGM-HF exclusion criteria do NOT include CCB, other-BB, or AV block.
# Turn off COMET-specific exclusion flags that don't apply.
exclude-ccb: false
exclude-other-bb: false
exclude-recent-mi: false
exclude-av-block: false
# ESRD handled via explicit CKD4+ ICD exclusion in stage1 pool; don't double-count
# via the COMET esrd_5y column (which won't exist in the paradigm_hf pool).
exclude-esrd: false
exclude-hepatic-failure: false

arms:
  - name: sacubitril_valsartan
    role: treated
    keywords: [SACUBITRIL, ENTRESTO]
    # skip_washout: ARNI starters commonly switched from prior enalapril/ACEi therapy.
    # Cross-arm prior-use exclusion would eliminate nearly the entire sacubitril arm.
    # "New to ARNI" is guaranteed by first_ever_arm_dispense; prior ACEi is expected.
    skip_washout: true
  - name: enalapril
    role: control
    keywords: [ENALAPRIL, VASOTEC, ENALAPRILAT]
    # washout applies: exclude enalapril starters who previously used ARNI (reverters)

inclusion:
  age_min: 18
  # age_max: none — no upper age limit in PARADIGM-HF (overridden above via age-max: 120)
  ef:
    threshold: 40.0
    direction: "<="             # HFrEF: LVEF ≤ 40%
    source: echo_or_icd
    lookback_days: 1825
  required_icd:
    # Any HF diagnosis ever (generous lookback captures prevalent HF patients)
    - name: hf_icd_ever
      codes: [I50]
      lookback_days: 36500      # ~100 years = effectively "ever"
      char: 3
  required_drug: []

exclusion:
  icd:
    # History of angioedema: ACEi-related angioedema is a contraindication to ARNI.
    # PARADIGM-HF excluded patients with prior angioedema on ACEi/ARB.
    - name: angioedema_ever
      codes: [T783, T886]
      lookback_days: 36500
      char: 4
    # Advanced CKD (eGFR < 30): PARADIGM-HF exclusion. ICD N184/N185/N186 = stage 4/5/ESRD.
    - name: ckd_stage4_plus_ever
      codes: [N184, N185, N186]
      lookback_days: 36500
      char: 4
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb          # NOTE: sacubitril/valsartan contains valsartan → flagged as ARB.
                        # This is structurally confounded with treatment; consider
                        # --exclude-psm-cols acei_arb in stage4 for PSM/Cox steps.
    - aldosterone_antag
    - digoxin
    - statin
    - nitrate
    - beta_blocker      # PARADIGM-HF required stable BB therapy at baseline
  condition_flags:
    - name: hfref_icd_5y
      codes: [I50]
      lookback_days: 1825
      char: 3
    - name: hfref_icd_24m
      codes: [I50]
      lookback_days: 730
      char: 3
    - name: hfref_icd_subcoded_i502_24m
      codes: [I502]
      lookback_days: 730
      char: 4
  extra_smd_cols: []

endpoint:
  primary:
    name: cv_death_hf_hosp
    followup_days: 1095           # PARADIGM-HF median follow-up ~27 months; use 3yr
    censor: administrative
    components:
      - type: mortality           # CV death proxied by all-cause death
      - type: inpatient_icd       # HF hospitalization (primary HF endpoint)
        codes: [I50]
        char: 3
        visit_concept_ids: [9201, 262]   # inpatient (9201) + ED (262)
  proxy_note: >
    CV death proxied by all-cause mortality (no cause-of-death coding in OMOP).
    HF hospitalization from OMOP visit_occurrence (concept_ids 9201/262) + I50.
    REQUIRES --visit-dir to be passed to stage1_build_pool.py; without it, HF hosp
    falls back to condition date only (overestimates events and blurs endpoint).
    Direct active-vs-active comparison: no placebo proxy needed.

ecg:
  window_days: 89               # < 90 days pre-index (pipeline requirement)
  window_mode: before
  pool_window_days: 365         # ecg_candidates breadth; stage3 narrows to window_days

feasibility:
  min_n_per_arm: 50
