# EMPA-REG OUTCOME — Empagliflozin Cardiovascular Outcome Event Trial in T2D
# Source: Zinman B et al. "Empagliflozin, Cardiovascular Outcomes, and Mortality
# in Type 2 Diabetes." N Engl J Med. 2015;373(22):2117-2128.

trial:
  key: empa_reg
  name: EMPA-REG OUTCOME
  full_name: "Empagliflozin Cardiovascular Outcome Event Trial in Type 2 Diabetes Patients"
  citation: "Zinman B et al., N Engl J Med 2015;373:2117-2128"
  published_hr: 0.86
  published_hr_ci: [0.74, 0.99]
  rct_duplicate_success: true

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: empagliflozin
    role: treated
    keywords: [EMPAGLIFLOZIN, JARDIANCE]
  - name: dpp4i
    role: control
    # Active comparator proxy for placebo arm: DPP4 inhibitor class
    keywords: [SITAGLIPTIN, SAXAGLIPTIN, LINAGLIPTIN, ALOGLIPTIN, VILDAGLIPTIN]

inclusion:
  age_min: 18
  required_icd:
    - name: dm_icd_ever
      codes: [E11]
      lookback_days: 1825
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: mace_3p
    followup_days: 1460           # ~3.1 years median follow-up
    censor: administrative
    components:
      - type: mortality           # CV death proxy (all-cause death)
      - type: condition_icd       # MI
        codes: [I21, I22]
        char: 3
      - type: condition_icd       # Stroke
        codes: [I63, I64, G45]
        char: 3
  proxy_note: >
    CV death proxied by all-cause mortality (Yale death table is date-only).
    Active comparator DPP4i substituted for placebo arm. Trial enrolled T2D
    patients with established CVD.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
