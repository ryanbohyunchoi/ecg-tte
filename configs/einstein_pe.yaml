# EINSTEIN PE — Oral Rivaroxaban for the Treatment of Symptomatic Pulmonary Embolism
# Source: EINSTEIN–PE Investigators. "Oral Rivaroxaban for the Treatment of Symptomatic
# Pulmonary Embolism." N Engl J Med. 2012;366(14):1287-1297.

trial:
  key: einstein_pe
  name: EINSTEIN PE
  full_name: "Oral Rivaroxaban for the Treatment of Symptomatic Pulmonary Embolism"
  citation: "EINSTEIN–PE Investigators, N Engl J Med 2012;366:1287-1297"
  published_hr: 1.12
  published_hr_ci: [0.75, 1.68]
  rct_duplicate_success: false

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: rivaroxaban
    role: treated
    keywords: [RIVAROXABAN, XARELTO]
  - name: enoxaparin_warfarin
    role: control
    # LMWH → warfarin bridge
    keywords: [ENOXAPARIN, DALTEPARIN, TINZAPARIN, WARFARIN, COUMADIN, JANTOVEN]

inclusion:
  age_min: 18
  required_icd:
    # Acute PE
    - name: pe_icd_ever
      codes: [I26]
      lookback_days: 365
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: recurrent_vte
    followup_days: 365            # 3-12 month follow-up period
    censor: administrative
    components:
      - type: condition_icd       # Recurrent PE
        codes: [I26]
        char: 3
      - type: condition_icd       # DVT
        codes: [I80]
        char: 3
      - type: mortality           # VTE-related death (proxied by all-cause death)
  proxy_note: >
    VTE-related death proxied by all-cause mortality. Control arm is enoxaparin bridge
    to warfarin. Emulation=false in RCT-DUPLICATE (non-inferiority design with wide CI).
    EINSTEIN PE was a non-inferiority trial — HR crossing 1.0 and CI 0.75-1.68 reflects
    equivalence, not superiority of warfarin.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
