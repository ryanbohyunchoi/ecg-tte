# SAVOR-TIMI 53 — Saxagliptin Assessment of Vascular Outcomes Recorded in Patients
# with Diabetes Mellitus–Thrombolysis in Myocardial Infarction 53
# Source: Scirica BM et al. "Saxagliptin and Cardiovascular Outcomes in Patients with
# Type 2 Diabetes Mellitus." N Engl J Med. 2013;369(14):1317-1326.

trial:
  key: savor_timi
  name: SAVOR-TIMI 53
  full_name: "Saxagliptin Assessment of Vascular Outcomes Recorded in Patients with Diabetes Mellitus–Thrombolysis in Myocardial Infarction 53"
  citation: "Scirica BM et al., N Engl J Med 2013;369:1317-1326"
  published_hr: 1.00
  published_hr_ci: [0.89, 1.12]
  rct_duplicate_success: false

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: saxagliptin
    role: treated
    keywords: [SAXAGLIPTIN, ONGLYZA, KOMBIGLYZE, QTERN]
  - name: sulfonylurea
    role: control
    # Active comparator proxy for placebo arm: sulfonylurea class
    keywords: [GLIPIZIDE, GLIMEPIRIDE, GLYBURIDE, GLIBENCLAMIDE, TOLBUTAMIDE]

inclusion:
  age_min: 18
  required_icd:
    - name: dm_icd_ever
      codes: [E11]
      lookback_days: 1825
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: mace_3p
    followup_days: 730            # ~2.1 years median follow-up
    censor: administrative
    components:
      - type: mortality           # CV death proxy (all-cause death)
      - type: condition_icd       # MI
        codes: [I21, I22]
        char: 3
      - type: condition_icd       # Stroke
        codes: [I63, I64, G45]
        char: 3
  proxy_note: >
    CV death proxied by all-cause mortality (Yale death table is date-only).
    Active comparator sulfonylurea substituted for placebo arm. Note: SAVOR-TIMI
    showed increased HF hospitalization with saxagliptin; emulation=false in
    RCT-DUPLICATE.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
