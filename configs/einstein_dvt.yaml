# EINSTEIN DVT — Oral Rivaroxaban for Symptomatic Venous Thromboembolism
# (DVT arm of EINSTEIN programme)
# Source: EINSTEIN Investigators. "Oral Rivaroxaban for Symptomatic Venous
# Thromboembolism." N Engl J Med. 2010;363(26):2499-2510.

trial:
  key: einstein_dvt
  name: EINSTEIN DVT
  full_name: "Oral Rivaroxaban for Symptomatic Venous Thromboembolism — DVT Study"
  citation: "EINSTEIN Investigators, N Engl J Med 2010;363:2499-2510"
  published_hr: 0.68
  published_hr_ci: [0.44, 1.04]
  rct_duplicate_success: true

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: rivaroxaban
    role: treated
    keywords: [RIVAROXABAN, XARELTO]
  - name: enoxaparin_warfarin
    role: control
    # LMWH → warfarin bridge; capture both components in EHR
    keywords: [ENOXAPARIN, DALTEPARIN, TINZAPARIN, WARFARIN, COUMADIN, JANTOVEN]

inclusion:
  age_min: 18
  required_icd:
    # Acute DVT
    - name: dvt_icd_ever
      codes: [I80]
      lookback_days: 365
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: recurrent_vte
    followup_days: 365            # 3-6-9-12 month comparisons; use 12m max
    censor: administrative
    components:
      - type: condition_icd       # Recurrent DVT
        codes: [I80]
        char: 3
      - type: condition_icd       # Pulmonary embolism
        codes: [I26]
        char: 3
      - type: mortality           # VTE-related death (proxied by all-cause death)
  proxy_note: >
    VTE-related death proxied by all-cause mortality. Control arm is enoxaparin bridge
    to warfarin (sequential therapy); EHR index date = first LMWH or warfarin dispense
    in ACS/VTE context. Both LMWH and warfarin keywords captured in control arm.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
