# ROCKET AF — Rivaroxaban Once Daily Oral Direct Factor Xa Inhibition Compared with
# Vitamin K Antagonism for Prevention of Stroke and Embolism Trial in Atrial Fibrillation
# Source: Patel MR et al. "Rivaroxaban versus Warfarin in Nonvalvular Atrial Fibrillation."
# N Engl J Med. 2011;365(10):883-891.

trial:
  key: rocket_af
  name: ROCKET AF
  full_name: "Rivaroxaban Once Daily Oral Direct Factor Xa Inhibition Compared with Vitamin K Antagonism for Prevention of Stroke and Embolism Trial in Atrial Fibrillation"
  citation: "Patel MR et al., N Engl J Med 2011;365:883-891"
  published_hr: 0.79
  published_hr_ci: [0.66, 0.96]
  rct_duplicate_success: true

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: rivaroxaban
    role: treated
    keywords: [RIVAROXABAN, XARELTO]
  - name: warfarin
    role: control
    keywords: [WARFARIN, COUMADIN, JANTOVEN]

inclusion:
  age_min: 18
  required_icd:
    - name: afib_icd_ever
      codes: [I48]
      lookback_days: 1825
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: stroke_systemic_embolism
    followup_days: 730            # ~1.9 years median follow-up
    censor: administrative
    components:
      - type: condition_icd       # Stroke (ischemic + hemorrhagic)
        codes: [I63, I64, G45]
        char: 3
      - type: condition_icd       # Systemic embolism
        codes: [I74]
        char: 3
  proxy_note: >
    Direct active vs active comparison (rivaroxaban vs warfarin) — no placebo
    proxy needed. Trial enrolled non-valvular AF patients with moderate-to-high
    stroke risk (CHADS2 ≥2).

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
