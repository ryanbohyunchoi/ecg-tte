# CAROLINA — Cardiovascular Outcome Study of Linagliptin versus Glimepiride in
# Patients with Type 2 Diabetes
# Source: Rosenstock J et al. "Effect of Linagliptin vs Glimepiride on Major
# Adverse Cardiovascular Outcomes in Patients With Type 2 Diabetes: The CAROLINA
# Randomized Clinical Trial." JAMA. 2019;322(12):1155-1166.

trial:
  key: carolina
  name: CAROLINA
  full_name: "Cardiovascular Outcome Study of Linagliptin versus Glimepiride in Patients with Type 2 Diabetes"
  citation: "Rosenstock J et al., JAMA 2019;322:1155-1166"
  published_hr: 0.98
  published_hr_ci: [0.84, 1.14]
  rct_duplicate_success: true

design:
  type: two_active_drug
  index_definition: first_ever_arm_dispense
  washout_days: 365

arms:
  - name: linagliptin
    role: treated
    keywords: [LINAGLIPTIN, TRADJENTA, GLYXAMBI, JENTADUETO]
  - name: glimepiride
    role: control
    keywords: [GLIMEPIRIDE, AMARYL, DUETACT]

inclusion:
  age_min: 18
  required_icd:
    - name: dm_icd_ever
      codes: [E11]
      lookback_days: 1825
      char: 3

exclusion:
  icd: []
  drug: []

covariates:
  comorbidities:
    - copd
    - htn
    - dm
    - cad_mi
    - afib
    - hyperlipidemia
    - stroke
  medications_90d:
    - loop_diuretic
    - acei_arb
    - aldosterone_antag
    - statin
  condition_flags: []
  extra_smd_cols: []

endpoint:
  primary:
    name: mace_3p
    followup_days: 2310           # ~6.3 years median follow-up
    censor: administrative
    components:
      - type: mortality           # CV death proxy (all-cause death)
      - type: condition_icd       # MI
        codes: [I21, I22]
        char: 3
      - type: condition_icd       # Stroke
        codes: [I63, I64, G45]
        char: 3
  proxy_note: >
    CV death proxied by all-cause mortality. Direct active vs active comparison
    (linagliptin vs glimepiride) — no placebo proxy needed. CAROLINA is the only
    DPP4i CV outcomes trial vs active comparator (SU) by design.

ecg:
  window_days: 89
  window_mode: before
  pool_window_days: 365

feasibility:
  min_n_per_arm: 50
